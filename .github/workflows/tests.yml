name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rumics
          POSTGRES_PASSWORD: rumics
          POSTGRES_DB: rumics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rumics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rumics:rumics@localhost:5432/rumics?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build server
        run: go build -o rumics-server .
      - name: Apply migrations
        run: go run ./migrations
      - name: Start server
        run: |
          ./rumics-server &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          echo "server did not start" >&2
          exit 1
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run E2E tests
        run: pytest tests/ -v
