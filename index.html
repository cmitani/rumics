<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rumics</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #101116;
      color: #f4f4f5;
    }
    main { width: min(100% - 32px, 760px); }
    h1 { margin: 0 0 8px; font-size: 2.4rem; }
    .subtitle { margin: 0 0 28px; color: #a3a3ad; }
    .panel {
      padding: 24px;
      border: 1px solid #2a2c36;
      border-radius: 16px;
      background: #191a21;
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button, input { width: 100%; border-radius: 9px; font: inherit; }
    button { padding: 13px; border: 0; cursor: pointer; font-weight: 700; }
    .create { background: #7c5cff; color: white; }
    .connect { background: #2a2c36; color: white; }
    form { display: none; margin-top: 22px; }
    form.active { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; font-size: .9rem; color: #c4c4cd; }
    input { padding: 12px; border: 1px solid #3a3c48; background: #101116; color: white; }
    .submit { background: #e9e9ee; color: #15151a; }
    .hint { margin: 2px 0 0; font-size: .8rem; color: #8f909b; }
    [hidden] { display: none !important; }
    .room-panel {
      min-height: 520px;
      display: flex;
      flex-direction: column;
    }
    .messages {
      flex: 1;
      min-height: 360px;
      padding: 16px;
      border: 1px solid #2a2c36;
      border-radius: 10px;
      color: #8f909b;
      background: #101116;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .message {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 82%;
    }
    .message.own { align-self: flex-end; align-items: flex-end; }
    .message.system { align-self: center; max-width: 100%; }
    .bubble {
      padding: 9px 13px;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      background: #262833;
      color: #f4f4f5;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message.own .bubble {
      background: #7c5cff;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 4px;
    }
    .message.system .bubble {
      background: transparent;
      border: 1px dashed #2a2c36;
      color: #8f909b;
    }
    .message-time { margin-top: 3px; font-size: .72rem; color: #8f909b; }
    .message-nick { font-size: .75rem; color: #a3a3ad; margin-bottom: 2px; }
    .file-name { font-weight: 700; margin-bottom: 3px; overflow-wrap: anywhere; }
    .file-size { font-size: .75rem; color: #b9b9c2; }
    .file-download {
      margin-top: 9px;
      padding: 7px;
      background: rgba(0, 0, 0, .3);
      color: #fff;
      font-size: .8rem;
    }
    .composer { display: flex; gap: 10px; margin-top: 16px; }
    .composer input { flex: 1; min-width: 0; }
    .composer button { width: auto; padding-inline: 20px; background: #7c5cff; color: white; }
    .composer .attach { padding-inline: 14px; background: #2a2c36; }
  </style>
</head>
<body>
  <main>
    <div id="home-view">
    <h1>Rumics</h1>
    <p class="subtitle">Создай приватную комнату или войди в существующую.</p>

    <section class="panel">
      <div class="actions">
        <button class="create" type="button" data-open="create-form">Create room</button>
        <button class="connect" type="button" data-open="connect-form">Connect</button>
      </div>

      
      <form id="create-form" action="/create" method="post">
        <label>
          Время жизни(часы)
          <input name="expire" type="number" min="1" required autocomplete="off">
        </label>
        <label>
          Удаление после бездействия (часы)
          <input name="idle_expire" type="number" min="0" step="0.5" placeholder="0 — не удалять" autocomplete="off">
        </label>
        <label>
          Лимит сообщений
          <input name="max_messages" type="number" min="0" step="1" placeholder="0 — без лимита" autocomplete="off">
        </label>
        <label>
          Лимит участников
          <input name="max_users" type="number" min="0" step="1" placeholder="0 — без лимита" autocomplete="off">
        </label>
        <label>
          Твой ник
          <input name="nick" type="text" maxlength="32" placeholder="Пусто — user1" autocomplete="off">
        </label>
        <label>
          Пароль комнаты
          <input name="password" type="password" minlength="8" required autocomplete="new-password">
        </label>
        <label>
          Повтори пароль
          <input id ="pass_conf" name="password_confirmation" type="password" minlength="8" required autocomplete="new-password">
        </label>
        <button class="submit" type="submit">Создать</button>
        <p class="hint">После создания сервер перенаправит тебя на ссылку комнаты.</p>
      </form>

      <form id="connect-form" action="/connect" method="post">
        <label>
          ID или ссылка комнаты
          <input name="room_id" type="text" required placeholder="Например: a1b2c3d4..." autocomplete="off">
        </label>
        <label>
          Пароль комнаты
          <input name="password" type="password" required autocomplete="current-password">
        </label>
        <label>
          Твой ник
          <input name="nick" type="text" maxlength="32" placeholder="Пусто — номер по порядку" autocomplete="off">
        </label>
        <button class="submit" type="submit">Войти в комнату</button>
      </form>
    </section>
    </div>

    <div id="room-view" hidden>
      <h1>Rumics room</h1>
      <p class="subtitle">Room ID: <span id="room-id">{{ .RoomID }}</span></p>
      <p class="subtitle" id="room-settings" hidden></p>
      <p class="subtitle" id="room-members" hidden></p>

      <section class="panel room-panel">
        <div id="messages" class="messages">
          Сообщений пока нет.
        </div>

        <form id="message-form" class="composer" action="/room/send" method="post">
          <input type="hidden" name="room_id" value="{{ .RoomID }}">
          <input
            id="message-input"
            name="message"
            type="text"
            placeholder="Напиши сообщение..."
            autocomplete="off"
            required
          >
          <input id="file-input" type="file" hidden>
          <button id="attach-button" type="button" class="attach" title="Прикрепить файл">📎</button>
          <button type="submit">Отправить</button>
        </form>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hash-wasm@4"></script>
  <script>

    const accessForms = document.querySelectorAll('#create-form, #connect-form');
    const homeView = document.getElementById('home-view');
    const roomView = document.getElementById('room-view');
    const roomIdElement = document.getElementById('room-id');
    const roomIdInput = document.querySelector('#message-form input[name="room_id"]');
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');
    const messagesElement = document.getElementById('messages');
    const roomSettingsElement = document.getElementById('room-settings');
    let lastMessageID = 0;
    let pollingTimer = null;
    let pollingInProgress = false;
    let wsConnection = null;
    let wsConnected = false;
    let wsReconnectDelay = 1000;
    let wsReconnectTimer = null;
    let heartbeatTimer = null;
    let membersMap = new Map();
    let lastFileID = 0;
    const membersLine = document.getElementById('room-members');
    const fileInput = document.getElementById('file-input');
    const attachButton = document.getElementById('attach-button');

    
    let clientID = localStorage.getItem('rumics-uid');
    if (!clientID) {
      clientID = crypto.randomUUID();
      localStorage.setItem('rumics-uid', clientID);
    }

    document.querySelectorAll('[data-open]').forEach((button) => {
      button.addEventListener('click', () => {
        accessForms.forEach((form) => {
          form.classList.toggle('active', form.id === button.dataset.open);
        });
      });
    });

    function base64ToBytes(value) {

      const binary = atob(value);
      return Uint8Array.from(binary, (character) => character.charCodeAt(0));
    }

    function hexToBytes(hex) {

      const bytes = new Uint8Array(hex.length / 2);
      for (let index = 0; index < bytes.length; index += 1) {
        bytes[index] = Number.parseInt(hex.slice(index * 2, index * 2 + 2), 16);
      }
      return bytes;
    }

    function bytesToBase64(bytes) {

      let binary = '';
      bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
      return btoa(binary);
    }

    function normalizeRoomID(value) {
      const input = value.trim();
      try {
        const url = new URL(input, window.location.origin);
        if (url.origin === window.location.origin) {
          return url.pathname.replace(/^\/+|\/+$/g, '');
        }
      } catch (error) {
        return input.replace(/^\/+|\/+$/g, '');
      }
      return input.replace(/^\/+|\/+$/g, '');
    }

    async function deriveWrappingKey(password, salt) {
      const hashHex = await window.hashwasm.argon2id({
        password,
        salt,
        iterations: 3,
        memorySize: 65536,
        parallelism: 1,
        hashLength: 32,
        outputType: 'hex'
      });

      return crypto.subtle.importKey(
        'raw',
        hexToBytes(hashHex),
        { name: 'AES-GCM' },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function createEncryptedRoomKey(password, salt) {
      
      const wrappingKey = await deriveWrappingKey(password, salt);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const roomKey = crypto.getRandomValues(new Uint8Array(32));
      const encrypted = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        wrappingKey,
        roomKey
      );

      return { iv, roomKey, encryptedRoomKey: new Uint8Array(encrypted) };
    }

    async function storeRoomKey(roomID, encryptedRoomKey, iv, keyHash) {
      const response = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          room_id: roomID,
          room_key: bytesToBase64(encryptedRoomKey),
          IV: bytesToBase64(iv),
          key_hash: keyHash
        })
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
    }

    async function roomKeyHash(roomKey) {
      const digest = await crypto.subtle.digest('SHA-256', roomKey);
      return bytesToBase64(new Uint8Array(digest));
    }

    async function authSession(roomID, keyHash) {
      const response = await fetch('/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          room_id: roomID,
          key_hash: keyHash
        })
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
    }

    async function uidHash() {
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(clientID));
      return bytesToBase64(new Uint8Array(digest));
    }

    function applyMembers(members) {
      membersMap = new Map();
      for (const member of members) {
        membersMap.set(member.uid_hash, member);
      }
      const line = members
        .map((member) => member.dead ? `${member.nick} (не в сети)` : member.nick)
        .join(', ');
      membersLine.textContent = line ? `Участники: ${line}` : '';
      membersLine.hidden = !line;
    }

    async function joinRoom(roomID, nick) {
      const response = await fetch('/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          room_id: roomID,
          uid_hash: await uidHash(),
          nick: nick || ''
        })
      });
      if (response.status === 403) {
        throw new Error('room full');
      }
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      const data = await response.json();
      applyMembers(data.members);
      return data.nick;
    }

    async function nickOf(uid) {
      if (!uid) {
        return '';
      }
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(uid));
      const member = membersMap.get(bytesToBase64(new Uint8Array(digest)));
      return member ? member.nick : '';
    }

    async function importMessageKey() {
      return crypto.subtle.importKey(
        'raw',
        window.roomKey,
        { name: 'AES-GCM' },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encryptMessage(text) {
      const key = await importMessageKey();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const payload = JSON.stringify({ v: 1, uid: clientID, text });
      const plaintext = new TextEncoder().encode(payload);
      const ciphertext = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        plaintext
      );
      return { ciphertext: new Uint8Array(ciphertext), iv };
    }

    async function decryptMessage(ciphertext, iv) {
      const key = await importMessageKey();
      const plaintext = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv },
        key,
        ciphertext
      );
      return new TextDecoder().decode(plaintext);
    }

    async function encryptFile(file) {
      const key = await importMessageKey();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const buffer = await file.arrayBuffer();
      const ciphertext = new Uint8Array(await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        buffer
      ));
      const headerPlain = new TextEncoder().encode(JSON.stringify({
        v: 2,
        uid: clientID,
        name: file.name,
        mime: file.type || 'application/octet-stream',
        size: file.size
      }));
      const hiv = crypto.getRandomValues(new Uint8Array(12));
      const header = new Uint8Array(await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv: hiv },
        key,
        headerPlain
      ));
      return { ciphertext, iv, header, hiv };
    }

    function parsePayload(plaintext) {
      try {
        const data = JSON.parse(plaintext);
        if (data && data.v === 1 && typeof data.uid === 'string' && typeof data.text === 'string') {
          return data;
        }
      } catch (error) {
        
      }
      return { uid: null, text: plaintext };
    }

    function formatTime(isoString) {
      const date = new Date(isoString);
      if (Number.isNaN(date.getTime())) {
        return '';
      }
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    function appendMessage(text, timeLabel, kind, nick) {
      if (messagesElement.dataset.empty !== 'false') {
        messagesElement.textContent = '';
        messagesElement.dataset.empty = 'false';
      }

      const nearBottom =
        messagesElement.scrollHeight - messagesElement.scrollTop - messagesElement.clientHeight < 80;
      const messageElement = document.createElement('div');
      messageElement.classList.add('message');
      if (kind) {
        messageElement.classList.add(kind);
      }
      if (nick && kind !== 'own' && kind !== 'system') {
        const nickElement = document.createElement('div');
        nickElement.className = 'message-nick';
        nickElement.textContent = nick;
        messageElement.appendChild(nickElement);
      }
      const bubbleElement = document.createElement('div');
      bubbleElement.className = 'bubble';
      bubbleElement.textContent = text;
      const timeElement = document.createElement('div');
      timeElement.className = 'message-time';
      timeElement.textContent = timeLabel;
      messageElement.append(bubbleElement, timeElement);
      messagesElement.appendChild(messageElement);
      if (nearBottom) {
        messagesElement.scrollTop = messagesElement.scrollHeight;
      }
    }

    async function renderIncoming(message) {
      if (Number(message.id) <= lastMessageID) {
        return;
      }
      try {
        const payload = parsePayload(await decryptMessage(
          base64ToBytes(message.ciphertext),
          base64ToBytes(message.iv)
        ));
        const own = payload.uid === clientID;
        appendMessage(
          payload.text,
          formatTime(message.created_at),
          own ? 'own' : '',
          own ? '' : await nickOf(payload.uid)
        );
      } catch (error) {
        appendMessage('[не удалось расшифровать сообщение]', formatTime(message.created_at), 'system');
      }
      lastMessageID = Math.max(lastMessageID, Number(message.id));
    }

    function formatSize(bytes) {
      if (!Number.isFinite(bytes) || bytes < 0) {
        return '';
      }
      if (bytes >= 1024 * 1024) {
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      }
      if (bytes >= 1024) {
        return `${Math.round(bytes / 1024)} KB`;
      }
      return `${bytes} Б`;
    }

    async function downloadFile(meta, mime, name) {
      try {
        const response = await fetch(`/file?id=${meta.id}`);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const key = await importMessageKey();
        const ciphertext = new Uint8Array(await response.arrayBuffer());
        const plaintext = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: base64ToBytes(meta.iv) },
          key,
          ciphertext
        );
        const url = URL.createObjectURL(new Blob([plaintext], { type: mime }));
        const link = document.createElement('a');
        link.href = url;
        link.download = name;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (error) {
        console.error('Не удалось скачать файл', error);
        alert('Не удалось скачать или расшифровать файл');
      }
    }

    function appendFileBubble(header, meta, nick) {
      if (messagesElement.dataset.empty !== 'false') {
        messagesElement.textContent = '';
        messagesElement.dataset.empty = 'false';
      }
      const nearBottom =
        messagesElement.scrollHeight - messagesElement.scrollTop - messagesElement.clientHeight < 80;
      const messageElement = document.createElement('div');
      messageElement.classList.add('message');
      if (header.own) {
        messageElement.classList.add('own');
      }
      if (nick) {
        const nickElement = document.createElement('div');
        nickElement.className = 'message-nick';
        nickElement.textContent = nick;
        messageElement.appendChild(nickElement);
      }
      const bubbleElement = document.createElement('div');
      bubbleElement.className = 'bubble';
      const nameElement = document.createElement('div');
      nameElement.className = 'file-name';
      nameElement.textContent = header.name;
      const sizeElement = document.createElement('div');
      sizeElement.className = 'file-size';
      sizeElement.textContent = formatSize(header.size);
      const downloadElement = document.createElement('button');
      downloadElement.type = 'button';
      downloadElement.className = 'file-download';
      downloadElement.textContent = 'Скачать';
      downloadElement.addEventListener('click', () => downloadFile(meta, header.mime, header.name));
      bubbleElement.append(nameElement, sizeElement, downloadElement);
      const timeElement = document.createElement('div');
      timeElement.className = 'message-time';
      timeElement.textContent = formatTime(meta.created_at);
      messageElement.append(bubbleElement, timeElement);
      messagesElement.appendChild(messageElement);
      if (nearBottom) {
        messagesElement.scrollTop = messagesElement.scrollHeight;
      }
    }

    async function renderFile(meta) {
      if (Number(meta.id) <= lastFileID) {
        return;
      }
      try {
        const header = JSON.parse(await decryptMessage(
          base64ToBytes(meta.header),
          base64ToBytes(meta.header_iv)
        ));
        if (!header || header.v !== 2 || typeof header.name !== 'string') {
          throw new Error('bad file header');
        }
        const own = header.uid === clientID;
        appendFileBubble({ ...header, own }, meta, own ? '' : await nickOf(header.uid));
      } catch (error) {
        appendMessage('[повреждённый файл]', formatTime(meta.created_at), 'system');
      }
      lastFileID = Math.max(lastFileID, Number(meta.id));
    }

    async function pollFiles() {
      if (!window.roomID || !window.roomKey) {
        return;
      }
      try {
        const params = new URLSearchParams({
          room_id: window.roomID,
          after_id: String(lastFileID)
        });
        const response = await fetch(`/files?${params}`);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const files = await response.json();
        for (const meta of files) {
          await renderFile(meta);
        }
      } catch (error) {
        console.error('Не удалось получить файлы', error);
      }
    }

    async function sendFile(file) {
      if (!file || !window.roomID || !window.roomKey) {
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        alert('Файл больше 10 MB');
        return;
      }
      try {
        const encrypted = await encryptFile(file);
        const params = new URLSearchParams({
          room_id: window.roomID,
          iv: bytesToBase64(encrypted.iv),
          hiv: bytesToBase64(encrypted.hiv),
          header: bytesToBase64(encrypted.header)
        });
        const response = await fetch(`/files?${params}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: encrypted.ciphertext
        });
        if (response.status === 401) {
          alert('Сессия истекла, перезагрузи страницу и подключись заново');
          return;
        }
        if (response.status === 413) {
          alert('Файл слишком большой');
          return;
        }
        if (response.status === 403) {
          alert('Комната не найдена или истекла');
          return;
        }
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        pollFiles();
      } catch (error) {
        console.error('Не удалось отправить файл', error);
        alert('Не удалось отправить файл');
      }
    }

    attachButton.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        sendFile(fileInput.files[0]);
      }
      fileInput.value = '';
    });

    async function loadHistory() {
      if (!window.roomID || !window.roomKey || pollingInProgress) {
        return;
      }
      pollingInProgress = true;
      try {
        const messageParams = new URLSearchParams({ room_id: window.roomID, after_id: '0' });
        const fileParams = new URLSearchParams({ room_id: window.roomID, after_id: '0' });
        const [messagesResponse, filesResponse] = await Promise.all([
          fetch(`/messages?${messageParams}`),
          fetch(`/files?${fileParams}`)
        ]);
        if (messagesResponse.status === 401 || filesResponse.status === 401) {
          if (pollingTimer !== null) {
            clearInterval(pollingTimer);
            pollingTimer = null;
          }
          alert('Сессия истекла, перезагрузи страницу и подключись заново');
          return;
        }
        if (!messagesResponse.ok || !filesResponse.ok) {
          throw new Error('history fetch failed');
        }
        const messages = await messagesResponse.json();
        const files = await filesResponse.json();
        const merged = [
          ...messages.map((item) => ({ kind: 'message', at: new Date(item.created_at).getTime() || 0, data: item })),
          ...files.map((item) => ({ kind: 'file', at: new Date(item.created_at).getTime() || 0, data: item }))
        ].sort((a, b) => a.at - b.at);
        for (const item of merged) {
          if (item.kind === 'message') {
            await renderIncoming(item.data);
          } else {
            await renderFile(item.data);
          }
        }
      } catch (error) {
        console.error('Не удалось загрузить историю', error);
      } finally {
        pollingInProgress = false;
      }
    }

    async function pollMessages() {
      if (!window.roomID || !window.roomKey || pollingInProgress || wsConnected) {
        return;
      }
      pollingInProgress = true;
      try {
        const params = new URLSearchParams({
          room_id: window.roomID,
          after_id: String(lastMessageID)
        });
        const response = await fetch(`/messages?${params}`);
        if (response.status === 401) {
          if (pollingTimer !== null) {
            clearInterval(pollingTimer);
            pollingTimer = null;
          }
          alert('Сессия истекла, перезагрузи страницу и подключись заново');
          return;
        }
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const messages = await response.json();
        for (const message of messages) {
          await renderIncoming(message);
        }
        await pollFiles();
      } catch (error) {
        console.error('Не удалось получить сообщения', error);
      } finally {
        pollingInProgress = false;
      }
    }

    function connectWS(roomID) {
      const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      wsConnection = new WebSocket(`${protocol}://${window.location.host}/ws?room_id=${encodeURIComponent(roomID)}`);
      wsConnection.onopen = () => {
        pollMessages();
        wsConnected = true;
        wsReconnectDelay = 1000;
      };
      wsConnection.onmessage = (event) => {
        let envelope;
        try {
          envelope = JSON.parse(event.data);
        } catch (error) {
          return;
        }
        if (envelope.type === 'message') {
          renderIncoming(envelope);
        }
        if (envelope.type === 'file') {
          renderFile(envelope);
        }
        if (envelope.type === 'presence') {
          applyMembers(envelope.members);
        }
      };
      wsConnection.onclose = () => {
        wsConnected = false;
        if (window.roomID === roomID) {
          wsReconnectTimer = setTimeout(() => connectWS(roomID), wsReconnectDelay);
          wsReconnectDelay = Math.min(wsReconnectDelay * 2, 30000);
        }
      };
    }

    function describeRoomSettings(settings) {
      if (!settings) {
        return '';
      }
      const parts = [];
      if (settings.expire_hours) {
        parts.push(`время жизни ${settings.expire_hours} ч`);
      }
      if (settings.idle_hours) {
        parts.push(`удаление после ${settings.idle_hours} ч без сообщений`);
      }
      if (settings.max_messages) {
        parts.push(`лимит ${settings.max_messages} сообщений`);
      }
      if (settings.max_users) {
        parts.push(`до ${settings.max_users} участников`);
      }
      return parts.join(' · ');
    }

    function startRoom(roomID, roomKey, settings) {
      window.roomID = roomID;
      window.roomKey = roomKey;
      roomIdElement.textContent = roomID;
      roomIdInput.value = roomID;
      messageInput.value = '';
      const description = describeRoomSettings(settings);
      roomSettingsElement.textContent = description;
      roomSettingsElement.hidden = !description;
      messagesElement.textContent = 'Сообщений пока нет.';
      messagesElement.dataset.empty = 'true';
      lastMessageID = 0;
      if (pollingTimer !== null) {
        clearInterval(pollingTimer);
      }
      if (heartbeatTimer !== null) {
        clearInterval(heartbeatTimer);
      }
      if (wsConnection) {
        wsConnection.onclose = null;
        wsConnection.close();
        wsConnection = null;
      }
      clearTimeout(wsReconnectTimer);
      wsConnected = false;
      wsReconnectDelay = 1000;
      membersMap = new Map();
      membersLine.hidden = true;
      lastFileID = 0;
      homeView.hidden = true;
      roomView.hidden = false;
      pollingTimer = setInterval(pollMessages, 1500);
      heartbeatTimer = setInterval(() => {
        joinRoom(roomID, '').catch((error) => console.error('join heartbeat failed', error));
      }, 60000);
      loadHistory();
      connectWS(roomID);
    }

    const createForm = document.getElementById('create-form');
    const connectForm = document.getElementById('connect-form');
    const initialRoomID = normalizeRoomID(roomIdElement.textContent);
    if (initialRoomID) {
      connectForm.elements.room_id.value = initialRoomID;
      connectForm.classList.add('active');
    }

    createForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = createForm.elements.password.value;
      const passwordConfirmation = createForm.elements.password_confirmation.value;
      const expire = createForm.elements.expire.value;
      const idleExpire = createForm.elements.idle_expire.value;
      const maxMessages = createForm.elements.max_messages.value;
      const maxUsers = createForm.elements.max_users.value;
      const nick = createForm.elements.nick.value;
      if (password !== passwordConfirmation) {
        alert('Пароли не совпадают');
        return;
      }

      try {
        const createResponse = await fetch('/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            expire,
            idle_expire: idleExpire || '0',
            max_messages: maxMessages || '0',
            max_users: maxUsers || '0'
          })
        });
        if (!createResponse.ok) {
          throw new Error(`HTTP ${createResponse.status}`);
        }
        const data = await createResponse.json();
        const roomID = data.room_id;
        const salt = base64ToBytes(data.salt);
        const encryptedRoomKey = await createEncryptedRoomKey(password, salt);
        const keyHash = await roomKeyHash(encryptedRoomKey.roomKey);
        await storeRoomKey(roomID, encryptedRoomKey.encryptedRoomKey, encryptedRoomKey.iv, keyHash);
        await authSession(roomID, keyHash);
        await joinRoom(roomID, nick);
        history.pushState({}, '', `/${roomID}`);
        startRoom(roomID, encryptedRoomKey.roomKey, {
          expire_hours: Number(expire),
          idle_hours: Number(idleExpire) || 0,
          max_messages: Number(maxMessages) || 0,
          max_users: Number(maxUsers) || 0
        });
      } catch (error) {
        console.error('Не удалось создать комнату', error);
        alert('Не удалось создать комнату');
      }
    });

    connectForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = connectForm.elements.password.value;
      const roomID = normalizeRoomID(connectForm.elements.room_id.value);
      if (!roomID) {
        alert('Укажи ID комнаты');
        return;
      }

      try {
        const response = await fetch('/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ room_id: roomID })
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const data = await response.json();
        const salt = base64ToBytes(data.salt);
        const encryptedRoomKey = base64ToBytes(data.room_key);
        const iv = base64ToBytes(data.iv);
        const wrappingKey = await deriveWrappingKey(password, salt);
        const decryptedRoomKey = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv },
          wrappingKey,
          encryptedRoomKey
        );
        const keyHash = await roomKeyHash(new Uint8Array(decryptedRoomKey));
        await authSession(roomID, keyHash);
        await joinRoom(roomID, connectForm.elements.nick.value);
        history.pushState({}, '', `/${roomID}`);
        startRoom(roomID, new Uint8Array(decryptedRoomKey), data.settings || null);
      } catch (error) {
        console.error('Не удалось подключиться к комнате', error);
        alert(error.message === 'room full' ? 'Комната заполнена' : 'Неверный пароль, ID комнаты или повреждённый ключ');
      }
    });

    messageForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !window.roomID || !window.roomKey) {
        return;
      }

      try {
        const encrypted = await encryptMessage(text);
        const response = await fetch('/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            room_id: window.roomID,
            ciphertext: bytesToBase64(encrypted.ciphertext),
            iv: bytesToBase64(encrypted.iv)
          })
        });
        if (!response.ok) {
          if (response.status === 401) {
            alert('Сессия истекла, перезагрузи страницу и подключись заново');
            return;
          }
          if (response.status === 403 || response.status === 429) {
            alert('Лимит сообщений комнаты исчерпан');
            return;
          }
          throw new Error(`HTTP ${response.status}`);
        }
        messageInput.value = '';
        pollMessages();
      } catch (error) {
        console.error('Не удалось отправить сообщение', error);
        alert('Не удалось отправить сообщение');
      }
    });
  </script>
</body>
</html>
